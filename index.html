<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1677ff"><title>KBO Live Hub</title>
<style>
*{box-sizing:border-box}html{background:#f2f2f7}body{margin:0;color:#17171a;font-family:-apple-system,BlinkMacSystemFont,"Pretendard",sans-serif;background:#f2f2f7;min-height:100vh}
header{position:sticky;top:0;z-index:20;background:#ffffffd9;backdrop-filter:blur(20px);border-bottom:1px solid #e5e5ea}
.nav{height:56px;max-width:800px;margin:auto;padding:0 16px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;font-size:19px;color:#1677ff}
.navlinks button{padding:6px 12px;border-radius:14px;border:none;background:transparent;color:#666;font-size:13px;font-weight:700;cursor:pointer}
.navlinks button.active{background:#1677ff;color:#fff}
main{max-width:800px;margin:auto;padding:16px 16px 60px}
.tab-content{display:none}.tab-content.active{display:block}

/* 경기 카드 */
.grid{display:grid;grid-template-columns:1fr;gap:14px}
.card{background:#fff;border-radius:20px;padding:18px;box-shadow:0 4px 14px rgba(0,0,0,0.05);cursor:pointer}
.head{display:flex;justify-content:space-between;color:#8e8e93;font-size:12px;font-weight:600}.live-badge{color:#ff3b30;font-weight:800}
.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:15px 0;text-align:center}
.team-name{font-size:20px;font-weight:800}.score-box{font-size:32px;font-weight:900;letter-spacing:-1px}
.inning-text{font-size:12px;color:#ff3b30;font-weight:700;margin-top:2px}

/* 그래픽 야구장 & 모달 */
.modal-bg{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);backdrop-filter:blur(8px);z-index:100;display:none;align-items:center;justify-content:center}
.modal{background:#fff;width:92%;max-width:500px;border-radius:28px;padding:20px;max-height:90vh;overflow-y:auto;position:relative}
.close-btn{position:absolute;top:16px;right:16px;border:none;background:#f2f2f7;border-radius:50%;width:30px;height:30px;font-weight:bold;cursor:pointer}
.field-container{position:relative;width:100%;height:220px;background:#2e7d32;border-radius:20px;margin:15px 0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.diamond{position:relative;width:120px;height:120px;transform:rotate(45deg);border:2px solid rgba(255,255,255,0.4);background:#bf360c}
.base{position:absolute;width:22px;height:22px;background:#fff;border:2px solid #ccc}
.base.active{background:#ffcc00;box-shadow:0 0 10px #ffcc00}
.b1{top:-11px;right:-11px}.b2{top:-11px;left:-11px}.b3{bottom:-11px;left:-11px}
.player-info-box{background:#f8f9fa;border-radius:14px;padding:12px;margin:8px 0;font-size:13px}

/* 테이블 공통 */
.rank-table{width:100%;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden;font-size:13px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
.rank-table th{background:#f2f2f7;padding:10px;color:#666;font-weight:700}
.rank-table td{padding:10px;border-bottom:1px solid #f2f2f7}
</style>
</head>
<body>

<header><div class="nav">
  <div class="brand">KBO LIVE</div>
  <div class="navlinks">
    <button id="tb-games" class="active" onclick="tab('games')">경기</button>
    <button id="tb-teams" onclick="tab('teams')">팀순위</button>
    <button id="tb-players" onclick="tab('players')">선수기록</button>
  </div>
</div></header>

<main>
  <!-- 1. 경기 탭 -->
  <section id="sec-games" class="tab-content active">
    <div id="games-list" class="grid"></div>
  </section>

  <!-- 2. 팀 순위 탭 -->
  <section id="sec-teams" class="tab-content">
    <table class="rank-table">
      <thead><tr><th>순위</th><th>팀</th><th>경기</th><th>승</th><th>패</th><th>무</th><th>승률</th><th>차</th></tr></thead>
      <tbody id="team-rank-body"></tbody>
    </table>
  </section>

  <!-- 3. 선수 기록 탭 -->
  <section id="sec-players" class="tab-content">
    <h3 style="margin:10px 0 8px">타율 TOP 4</h3>
    <table class="rank-table" style="margin-bottom:20px">
      <thead><tr><th>순위</th><th>선수</th><th>팀</th><th>타율</th><th>안타</th><th>홈런</th></tr></thead>
      <tbody id="hitter-rank-body"></tbody>
    </table>

    <h3 style="margin:10px 0 8px">평균자책점 TOP 4</h3>
    <table class="rank-table">
      <thead><tr><th>순위</th><th>선수</th><th>팀</th><th>ERA</th><th>승</th><th>탈삼진</th></tr></thead>
      <tbody id="pitcher-rank-body"></tbody>
    </table>
  </section>
</main>

<!-- 야구장 및 실시간 정보 모달 -->
<div id="modal" class="modal-bg" onclick="closeM(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <button class="close-btn" onclick="closeM()">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

<script>
let stateData = null;

function tab(name){
  document.querySelectorAll('.navlinks button').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(s=>s.classList.remove('active'));
  document.getElementById('tb-'+name).classList.add('active');
  document.getElementById('sec-'+name).classList.add('active');
}

function openM(idx){
  const g = stateData.d[idx];
  const r = g.RUNNERS || {};
  
  document.getElementById('modal-body').innerHTML = `
    <div style="text-align:center;font-size:12px;color:#888">${g.G_TM} · ${g.S_NM}</div>
    <div style="display:flex;justify-content:space-around;align-items:center;margin:10px 0">
      <h2>${g.AWAY_NM} ${g.T_SCORE_CN}</h2>
      <div style="color:#ff3b30;font-weight:bold">${g.GAME_INN_NO} ${g.GAME_TB_SC_NM}</div>
      <h2>${g.B_SCORE_CN} ${g.HOME_NM}</h2>
    </div>

    <!-- 그래픽 야구장 주자 위치 -->
    <div class="field-container">
      <div class="diamond">
        <div class="base b1 ${r.base1?'active':''}"></div>
        <div class="base b2 ${r.base2?'active':''}"></div>
        <div class="base b3 ${r.base3?'active':''}"></div>
      </div>
    </div>

    <!-- 투수 및 타자 정보 -->
    <div class="player-info-box">
      <b>투수:</b> ${g.PITCHER.name} (${g.PITCHER.record}, ${g.PITCHER.pCount}구)
    </div>
    <div class="player-info-box">
      <b>타자:</b> ${g.BATTER.name} (타율 ${g.BATTER.avg}, 오늘 ${g.BATTER.record})
    </div>
    <div class="player-info-box" style="text-align:center">
      <b>B:</b> ${g.BALL_CN} | <b>S:</b> ${g.STRIKE_CN} | <b>O:</b> ${g.OUT_CN}
    </div>
  `;
  document.getElementById('modal').style.display = 'flex';
}

function closeM(){ document.getElementById('modal').style.display = 'none'; }

async function load(){
  try{
    let res = await fetch('/api/kbo');
    stateData = await res.json();
    
    // 경기 리스트 렌더링
    document.getElementById('games-list').innerHTML = stateData.d.map((g, i) => `
      <div class="card" onclick="openM(${i})">
        <div class="head"><span>${g.G_TM} · ${g.S_NM}</span><span class="live-badge">${g.GAME_STATE_SC}</span></div>
        <div class="teams">
          <div class="team-name">${g.AWAY_NM}</div>
          <div><div class="score-box">${g.T_SCORE_CN} : ${g.B_SCORE_CN}</div><div class="inning-text">${g.GAME_INN_NO} ${g.GAME_TB_SC_NM}</div></div>
          <div class="team-name">${g.HOME_NM}</div>
        </div>
        <div style="font-size:12px;color:#666;text-align:center">투수: ${g.PITCHER.name} | 타자: ${g.BATTER.name}</div>
      </div>
    `).join('');

    // 팀 순위 렌더링
    document.getElementById('team-rank-body').innerHTML = stateData.teams.map(t => `
      <tr><td><b>${t.rank}</b></td><td>${t.team}</td><td>${t.games}</td><td>${t.win}</td><td>${t.loss}</td><td>${t.draw}</td><td>${t.pct}</td><td>${t.diff}</td></tr>
    `).join('');

    // 타자 순위 렌더링
    document.getElementById('hitter-rank-body').innerHTML = stateData.players.hitters.map(h => `
      <tr><td><b>${h.rank}</b></td><td>${h.name}</td><td>${h.team}</td><td>${h.avg}</td><td>${h.hits}</td><td>${h.hr}</td></tr>
    `).join('');

    // 투수 순위 렌더링
    document.getElementById('pitcher-rank-body').innerHTML = stateData.players.pitchers.map(p => `
      <tr><td><b>${p.rank}</b></td><td>${p.name}</td><td>${p.team}</td><td>${p.era}</td><td>${p.win}</td><td>${p.SO}</td></tr>
    `).join('');

  }catch(e){}
}

load();
</script>
</body>
</html>
